# ChairOS iOS — cloud Mac build via Codemagic.
#
# SETUP (one time, in the Codemagic UI):
#  1. Add this repo to Codemagic, select this codemagic.yaml.
#  2. Code signing: iOS code signing tab -> "Automatic code signing" with an
#     App Store Connect API key (needs the paid Apple Developer enrollment).
#     Codemagic will create/fetch the provisioning profile for cc.chairos.app.
#  3. Apple Developer Portal -> Certificates, Identifiers & Profiles ->
#     Identifiers -> cc.chairos.app -> enable "Push Notifications".
#  4. Apple Developer Portal -> Keys -> create an APNs Auth Key (.p8), note
#     the Key ID and Team ID. The server needs these as env vars (see below).
#  5. In Vercel (and locally for builds): nothing extra — the app loads
#     https://chairos.cc at runtime, so the IPA never bundles web content.
#
# SERVER ENV (Vercel) needed for pushes to actually deliver — all set AFTER
# Apple enrollment, stored in the Secure Vault, never in git:
#   APNS_TEAM_ID   - 10-char Apple Team ID
#   APNS_KEY_ID    - 10-char APNs key ID
#   APNS_KEY       - contents of the .p8 file (use \n for line breaks)
# Until those exist, the app registers tokens fine and pushes no-op safely.
workflows:
  # Free proof the iOS project compiles — no Apple Developer enrollment needed.
  # Builds for the iPhone simulator with code signing disabled. Run this first;
  # ios-testflight below is the paid path (signing + TestFlight upload).
  ios-simulator-check:
    name: ChairOS iOS simulator compile check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Build for simulator (no code signing)
        script: |
          xcodebuild -workspace "ios/App/App.xcworkspace" \
            -scheme "App" \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: ChairOS iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_ids:
          - cc.chairos.app
      vars:
        # Provided by Codemagic's automatic code signing integration.
        APP_STORE_CONNECT_ISSUER_ID: Encrypted(...)
        APP_STORE_CONNECT_KEY_IDENTIFIER: Encrypted(...)
        APP_STORE_CONNECT_PRIVATE_KEY: Encrypted(...)
        CERTIFICATE_PRIVATE_KEY: Encrypted(...)
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Sync Capacitor iOS project
        script: npx cap sync ios
      - name: Set up keychain for code signing
        script: keychain initialize
      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "cc.chairos.app" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight; submit_to_app_store stays manual until
        # Thomas gives the word after testing the build.
        submit_to_testflight: true
