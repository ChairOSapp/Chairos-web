# Dependabot keeps ChairOS dependencies patched.
# Security updates are reviewed and merged promptly; this file backs
# PCI DSS requirement 6.3.1 (vulnerability identification process).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
